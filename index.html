<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>放置天堂 - 賭場/商城 MOD 書籤小工具 v2</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f1f5f9; padding: 20px; line-height: 1.6; }
    .box { background: #1e293b; border: 2px solid #38bdf8; border-radius: 12px; padding: 24px; max-width: 600px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { color: #facc15; margin-top: 0; }
    .bookmarklet { display: inline-block; background: #7c3aed; color: white; padding: 14px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 16px; cursor: grab; margin: 16px 0; border: 1px solid #a78bfa; }
    .copy-btn { display: block; width: 100%; background: #0284c7; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; box-sizing: border-box; }
    .copy-btn:active { background: #0369a1; }
    ol { padding-left: 20px; }
    code { background: #0f172a; padding: 2px 6px; border-radius: 4px; color: #38bdf8; }
    .mobile-sec { background: #0f172a; padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px dashed #475569; }
  </style>
</head>
<body>

<div class="box">
  <h2>🎰 放置天堂 賭場/商城 MOD 書籤小工具 v2</h2>
  <p style="color:#fbbf24; font-size: 14px;">v2 版本修復了換行問題，採用 Base64 打包，適用於電腦與手機環境。</p>

  <!-- 電腦專用 -->
  <a class="bookmarklet" id="modLink" href="#">🎰 放置天堂賭場商城MOD v2 (拖我到書籤列)</a>

  <!-- 手機專用區塊 -->
  <div class="mobile-sec">
    <strong style="color:#38bdf8;">📱 手機安裝步驟：</strong>
    <button class="copy-btn" onclick="copyCode()">📋 點此複製 MOD 代碼</button>
    <ol style="font-size: 14px; margin-bottom: 0;">
      <li>點擊上方按鈕複製代碼。</li>
      <li>將任意網頁（或本頁）加入瀏覽器書籤，命名為 <code>放置天堂 MOD</code>。</li>
      <li>進入書籤清單點擊「編輯」，把網址 (URL) 欄位內容完全刪除並<b>貼上剛複製的代碼</b>。</li>
      <li>在遊戲頁面點擊該書籤即可喚醒選單！</li>
    </ol>
  </div>
</div>

<script>
  const code = `javascript:fetch('https://raw.githubusercontent.com/jack1988520-pixel/casino.js/main/casino.js').then(r=>r.text()).then(eval)`;
document.getElementById('modLink').href = code;
function copyCode() {
  navigator.clipboard.writeText(code).then(() => {
    alert('✅ 已複製 MOD 代碼！請前往編輯書籤並貼上至網址欄。');
  }).catch(() => {
    alert('複製失敗，請手動複製。');
  });
}
</script>

</body>
</html>
